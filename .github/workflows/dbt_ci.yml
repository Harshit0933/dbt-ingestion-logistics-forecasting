name: dbt Data Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  dbt-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery==1.12.1

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/101221995363/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider-v2'
          service_account: '101221995363-compute@developer.gserviceaccount.com'
          project_id: 'data-warehouse-513514'
          token_format: 'access_token'
      
      - name: Install dbt packages
        run: dbt deps --project-dir logistics_forecasting

      - name: Run dbt Data Pipeline
        run: |
          # 1. Fetch the main branch to compare changes
          git fetch origin main
          
          # 2. Check if any file in the marts folder was modified
          if git diff --name-only origin/main...HEAD | grep -q "models/marts/"; then
            echo "New feature detected in marts. Triggering full historical backfill..."
            dbt build --full-refresh --project-dir logistics_forecasting --profiles-dir logistics_forecasting
          else
            echo "No structural changes. Running standard daily incremental build..."
            dbt build --project-dir logistics_forecasting --profiles-dir logistics_forecasting
          fi
