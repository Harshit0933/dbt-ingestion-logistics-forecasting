version: 2

models:
  - name: fct_logistics_demand_features
    description: "Master time-series feature store for logistics demand forecasting."
    columns:
      - name: target_date
        description: "Continuous date spine (no gaps)."
        data_type: date
        tests:
          - not_null
          
      - name: zone_id
        description: "Delivery zone identifier."
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__dim_zones')
                field: zone_id
                
      - name: total_orders
        description: "Aggregated daily order volume. Coalesced to 0 for missing days."
        data_type: int64
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                
      - name: temperature_celsius
        description: "Daily average temperature. Contains nulls for zones/dates lacking sensor data."
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -30
                max_value: 60
                
      - name: rainfall_mm
        description: "The volume of liquid rain recorded on the target date, measured in millimeters (mm). This metric is only populated when the daily temperature is above 0°C; otherwise, it records as 0."
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 500
                
      - name: snowfall_cm
        description: "The depth of solid snowfall recorded on the target date, measured in centimeters (cm). This metric is only populated when the daily temperature is 0°C or below; otherwise, it records as 0."
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 500
        
      - name: city
        description: "The German city where the delivery zone is located (e.g., Berlin, Munich, Hamburg)."
        data_type: string
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Berlin', 'Hamburg', 'Munich', 'Cologne', 'Frankfurt']
      
      - name: holiday_name
        description: "The German name of the public holiday, if applicable. Null on non-holidays."
        data_type: string

      - name: is_holiday
        description: "Flag indicating if the target date is a public holiday (1 = Yes, 0 = No)."
        data_type: int64
        
      - name: is_day_before_holiday
        description: "Flag indicating if the target date immediately precedes a public holiday (1 = Yes, 0 = No)."
        data_type: int64
        
      - name: is_day_after_holiday
        description: "Flag indicating if the target date immediately follows a public holiday (1 = Yes, 0 = No)."
        data_type: int64

      
  - name: metricflow_time_spine
    description: "Master time spine table required by the dbt Semantic Layer (MetricFlow)."
    columns:
      - name: date_day
        data_type: date
        tests:
          - not_null

unit_tests:
  - name: test_fct_demand_features_coalesces_nulls_to_zero
    description: "Ensures days without transactions return 0 rather than null."
    model: fct_logistics_demand_features
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_geo_date_spine')
        rows:
          - {target_date: '2023-10-01', zone_id: 'zone_1'}
      - input: ref('stg_raw__transactions')
        rows: [] 
      - input: ref('stg_raw__dim_zones')
        rows:
          - {zone_id: 'zone_1', region: 'Berlin'}
      - input: ref('stg_raw__weather_actuals')
        rows:
          - {target_date: '2023-10-01', region: 'Berlin', temperature_celsius: 20, rainfall_mm: 5, snowfall_cm: 0}
      - input: ref('int_city_holidays_expanded')
        rows: []
    expect:
      rows:
        - {target_date: '2023-10-01', zone_id: 'zone_1', city: 'Berlin', total_orders: 0, total_items_sold: 0, temperature_celsius: 20, rainfall_mm: 5, snowfall_cm: 0, orders_lag_7d: null, holiday_name: null, is_holiday: 0, is_day_before_holiday: 0, is_day_after_holiday: 0}
